<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Docker Security Auditor architecture</title><desc id="desc">Explicit Docker inspect or offline JSON feeds configuration policy checks and produces severity-ranked JSON and HTML reports. CI thresholds are optional.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#12243a"/></linearGradient></defs>
<style>text{font-family:Arial,sans-serif}.label{font-size:12px;letter-spacing:2px;fill:#8da6c3}.title{font-size:19px;font-weight:700;fill:#eef5ff}.body{font-size:15px;fill:#b5c8df}.line{stroke:#40708e;stroke-width:2;fill:none}.dot{animation:blink 3s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}</style>
<rect width="1100" height="580" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1098" height="578" rx="24" fill="none" stroke="#29415d"/>
<text x="44" y="48" class="label">CONTAINER CONFIGURATION REVIEW</text>
<text x="44" y="91" fill="#f3f8ff" font-size="36" font-weight="700">Docker Security Auditor</text>
<text x="44" y="122" class="body">Explicit input. Contextual findings. Actionable review guidance.</text>
<rect x="44" y="160" width="1012" height="34" rx="8" fill="#142b40"/>
<circle cx="62" cy="177" r="4" fill="#59dac7" class="dot"/><text x="78" y="182" class="body">READ ONLY</text><text x="250" y="182" class="body">PYTHON 3.10+</text><text x="465" y="182" class="body">STANDARD LIBRARY</text><text x="740" y="182" class="body">OFFLINE FIXTURES</text>
<g fill="#101f32" stroke="#34516f"><rect x="44" y="234" width="280" height="220" rx="15"/><rect x="410" y="234" width="280" height="220" rx="15"/><rect x="776" y="234" width="280" height="220" rx="15"/></g>
<path d="M324 344H410M690 344H776" class="line"/><path d="m400 338 10 6-10 6m366-12 10 6-10 6" class="line"/>
<text x="66" y="266" class="label">01 / COLLECT</text><text x="66" y="300" class="title">Inspect configuration</text>
<text x="66" y="337" class="body">Named local container</text><text x="66" y="365" class="body">or recorded JSON fixture</text><text x="66" y="414" fill="#59dac7" font-size="13">No container mutations</text>
<text x="432" y="266" class="label">02 / EVALUATE</text><text x="432" y="300" class="title">Configuration policies</text>
<text x="432" y="337" class="body">Privileges and confinement</text><text x="432" y="365" class="body">Mounts, devices and limits</text><text x="432" y="393" class="body">Secret-name heuristics</text><text x="432" y="425" fill="#59dac7" font-size="13">Sensitive values omitted</text>
<text x="798" y="266" class="label">03 / REVIEW</text><text x="798" y="300" class="title">Prioritized findings</text>
<text x="798" y="337" class="body">JSON and escaped HTML</text><text x="798" y="365" class="body">Remediation guidance</text><text x="798" y="393" class="body">Optional CI severity gate</text><text x="798" y="425" fill="#59dac7" font-size="13">Human validation required</text>
<g font-size="13"><circle cx="54" cy="494" r="5" fill="#ff6a88"/><text x="67" y="499" fill="#ffb5c5">Critical</text><circle cx="180" cy="494" r="5" fill="#ffaf65"/><text x="193" y="499" fill="#ffd0a3">High</text><circle cx="284" cy="494" r="5" fill="#f1d46b"/><text x="297" y="499" fill="#f1dfa0">Medium</text><circle cx="418" cy="494" r="5" fill="#74b7ff"/><text x="431" y="499" fill="#acd2ff">Low</text></g>
<text x="44" y="545" fill="#8da6c3" font-size="13">Configuration signals support review; they do not establish exploitability or CIS compliance.</text>
</svg>