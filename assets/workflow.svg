<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img"><title>DevSecOps Pipeline Demo</title><desc>Conceptual project workflow, not live telemetry.</desc><style>.packet{animation:travel 6s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}.spin{transform-origin:230px 155px;animation:spin 10s linear infinite}@keyframes travel{0%{transform:translateX(0);opacity:.2}50%{opacity:1}100%{transform:translateX(270px);opacity:.2}}@keyframes pulse{50%{opacity:.2}}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.packet,.pulse,.spin{animation:none}}</style><rect width="1000" height="300" rx="18" fill="#080f1d"/><g font-family="monospace"><text x="28" y="40" fill="#7dd3fc" font-size="22">DEVSECOPS PIPELINE DEMO</text><rect x="35" y="105" width="205" height="115" rx="12" fill="#12233a" stroke="#38bdf8"/><text x="55" y="153" fill="#38bdf8" font-size="17">TEST</text><rect x="280" y="105" width="205" height="115" rx="12" fill="#12233a" stroke="#fbbf24"/><text x="300" y="153" fill="#fbbf24" font-size="17">AST GATE</text><rect x="525" y="105" width="205" height="115" rx="12" fill="#12233a" stroke="#a78bfa"/><text x="545" y="153" fill="#a78bfa" font-size="17">BUILD</text><rect x="770" y="105" width="205" height="115" rx="12" fill="#12233a" stroke="#2dd4bf"/><text x="790" y="153" fill="#2dd4bf" font-size="17">SMOKE CHECK</text><path class="pulse" d="M50 240H940" stroke="#2dd4bf" stroke-width="3"/><text x="28" y="280" fill="#8099b5" font-size="12">CONCEPTUAL WORKFLOW / fresh portfolio implementation</text></g></svg>